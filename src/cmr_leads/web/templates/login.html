<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · CMR Lead Finder</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0A1F44">
  <link rel="stylesheet" href="{{ url_for('static', path='tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <style>
    .login-page { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); }
    .login-card { width: 100%; max-width: 380px; }
    .login-card .brand-logo { display: block; margin: 0 auto 12px; }
    .login-card h1 { text-align: center; font-size: 1.25rem; margin: 0 0 4px; }
    .login-card .btn { width: 100%; justify-content: center; }
  </style>
</head>
<body>
<main class="login-page">
  <form class="card login-card" method="post" action="/login">
    <img class="brand-logo" src="/static/img/cmr-cubo-blanco.png" width="48" height="48" alt="" style="background: var(--cmr-navy); border-radius: 12px; padding: 6px">
    <h1>CMR Lead Finder</h1>
    <p class="muted small" style="text-align:center">Entrá con tu usuario del gestor de CMR.</p>
    {% if error %}<div class="notice" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="siguiente" value="{{ next_url }}">
    <div class="field"><label for="usuario">Usuario</label><input id="usuario" name="usuario" type="text" autocomplete="username" placeholder="tomi, chipi o gena" required autofocus></div>
    <div class="field"><label for="clave">Contraseña</label><input id="clave" name="clave" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary">Ingresar</button>
  </form>
</main>
</body>
</html>
