[project]
name = "cmr-lead-finder"
version = "0.1.0"
description = "Herramienta de prospección y gestión de potenciales clientes locales para CMR Software Solutions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.6",
    "jinja2>=3.1",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "anthropic>=2.0",
    "fpdf2>=2.8",
    "pillow>=10.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
cmr-leads = "cmr_leads.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmr_leads"]
artifacts = ["src/cmr_leads/web/templates/*", "src/cmr_leads/web/static/*", "src/cmr_leads/messaging/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# El formatter maneja el largo del código; quedan textos largos para la CLI y mensajes.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form", "fastapi.File"]
