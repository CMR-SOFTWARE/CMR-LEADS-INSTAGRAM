# Plantillas del primer mensaje (se usan cuando no hay borrador de IA).
#
# Reglas (también las sigue la IA):
# - Presentarse como {firma}. Máximo ~45 palabras.
# - Preguntas solo con "?" al final (nunca "¿" ni "¡").
# - No afirmar nada que no esté verificado: si no es seguro, preguntarlo
#   ("Los turnos los toman por WhatsApp?").
# - Sin videos y sin "promo de lanzamiento" en el primer contacto.
# - Casos reales (Canito Skin, Automóvil Club San Nicolás, Ferretería González) y cerrar con una
#   pregunta fácil.
#
# Variables: {firma} {nombre} (mejor no usar {nombre}: los nombres de Google suelen ser largos)
# {plural|singular}: la primera opción es para un negocio (ustedes) y la segunda para un
# profesional que trabaja solo (Lic., Dra., psicóloga…), al que se le habla de vos.
#
# A/B: cada plantilla tiene versión "a" y "b". A cada lead le toca siempre la misma (por su número)
# y queda guardada al registrar el envío: en "Respuestas → Por mensaje" se compara cuál anda mejor.

firma: Tomi de CMR, de acá de San Nicolás

plantillas:
  estetica:
    a: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. A Canito Skin le armamos los turnos online y
      ahora la gente reserva sola a cualquier hora. Los turnos {los toman|los tomás} por
      WhatsApp? {Les|Te} muestro cómo funciona?
    b: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. Los turnos {los toman|los tomás} por WhatsApp?
      Con CMR Nexo la gente reserva sola las 24 hs y le llega la confirmación por WhatsApp,
      como en Canito Skin. {Les|Te} muestro cómo funciona?

  gimnasio:
    a: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. Los lugares en las clases {los manejan|los
      manejás} por WhatsApp? Con CMR Nexo los alumnos se anotan solos a cualquier hora y les llega
      la confirmación por WhatsApp. {Les|Te} muestro cómo funciona?
    b: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. Hicimos los turnos online de Canito Skin y con
      CMR Nexo lo mismo sirve para clases: los alumnos se anotan solos y les llega la confirmación
      por WhatsApp. {Les|Te} interesa verlo?

  salud:
    a: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. Los turnos {los dan|los das} por WhatsApp o por
      teléfono? Con CMR Nexo los pacientes sacan turno solos las 24 hs y les llega la confirmación
      por WhatsApp. {Les|Te} muestro cómo funciona?
    b: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. Tenemos CMR Nexo, una agenda online: los
      pacientes reservan solos y {ustedes ven|vos ves} todos los turnos ordenados. Algo así le
      armamos a Canito Skin. {Les|Te} sirve que {les|te} cuente?

  gastronomia:
    a: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. Los pedidos {los toman|los tomás} por WhatsApp?
      {Les|Te} podemos armar la carta online con los pedidos directo a {su|tu} WhatsApp, sin
      comisiones de apps. {Les|Te} muestro un ejemplo?
    b: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. A Planeta Surf le armamos la tienda online con su
      panel; para un local de comida es lo mismo con la carta y los pedidos a WhatsApp. {Les|Te}
      interesa verlo?

  canchas:
    a: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. Las reservas de las canchas {las toman|las tomás}
      por WhatsApp? Con CMR Canchas la gente reserva online a cualquier hora y ve los horarios
      libres. {Les|Te} muestro cómo funciona?
    b: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. Le hicimos el sistema de reservas de canchas al
      Automóvil Club San Nicolás: la gente reserva online sin llamar ni mandar mensajes. {Les|Te}
      muestro cómo funciona?

  comercio_sin_web:
    a: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. No encontré {su|tu} página web.
      {Tienen|Tenés}? Armamos webs para que {los|te} encuentren en Google y {les|te} escriban
      directo por WhatsApp. {Les|Te} muestro un ejemplo?
    b: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. A Ferretería González le hicimos la web: ahí los
      clientes ven lo que tienen y les escriben por WhatsApp. {Tienen|Tenés} página web? {Les|Te}
      muestro cómo quedaría?

  turnos:
    a: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. Los turnos {los toman|los tomás} por WhatsApp?
      Con CMR Nexo los clientes reservan solos las 24 hs y les llega la confirmación por WhatsApp.
      {Les|Te} muestro cómo funciona?
    b: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. A Canito Skin le armamos los turnos online y
      ahora sus clientes reservan solos a cualquier hora. {Les|Te} interesa algo así?

  mejora_web:
    a: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. {La web la actualizan|Tu web la actualizás}
      seguido? Renovamos webs para que se vean bien en el celular y {les|te} escriban directo por
      WhatsApp. {Les|Te} muestro un ejemplo?
    b: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. A Ferretería González le hicimos la web y se ve
      bien en el celular. {Les|Te} interesa ver cómo quedaría la
      {suya|tuya}?

  generico:
    a: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. Hacemos webs y sistemas para negocios de la zona,
      como Ferretería González y Canito Skin. {Les|Te} cuento qué podríamos hacer para {ustedes|vos}?
    b: >-
      Hola, {cómo andan|cómo andás}? Soy {firma}. Armamos webs, turnos online y sistemas a medida
      para negocios de la zona. Cómo {manejan|manejás} hoy las consultas de clientes?

# Seguimientos (día 3 y día 7) para quien no contestó. Mismas variables.
seguimientos:
  1: >-
    Hola, {cómo andan|cómo andás}? Soy Tomi de CMR, {les|te} escribí hace unos días. Si {les|te}
    sirve, {les|te} muestro cómo funcionaría en {su|tu} negocio, sin compromiso. {Les|Te} va?
  2: >-
    Hola de nuevo, soy Tomi de CMR. No quiero insistir: si no es el momento, {avísenme|avisame} y
    no {les|te} escribo más. Si {les|te} interesa, lo charlamos cuando {puedan|puedas}.
